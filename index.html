<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자산 대시보드1</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg: #0f0f13;
    --surface: #16161d;
    --surface2: #1e1e28;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8e8f0;
    --text2: #8888a8;
    --text3: #7c7c98;
    --accent-blue: #4f8fff;
    --accent-green: #3dd68c;
    --accent-purple: #a78bfa;
    --accent-amber: #f59e0b;
    --accent-red: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(79,143,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,143,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
  .wrapper { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; position: relative; z-index: 1; }

  header { margin-bottom: 2rem; display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent-blue); }
  header p { color: var(--text2); font-size: 12px; margin-top: 4px; }

  .status-badge {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 0.5px solid var(--border2);
    border-radius: 20px; padding: 6px 14px; font-size: 12px; color: var(--text2);
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text3); }
  .status-dot.ok { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
  .status-dot.err { background: var(--accent-red); }
  .status-dot.loading { background: var(--accent-amber); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.5rem; }
  .card {
    background: var(--surface); border: 0.5px solid var(--border2);
    border-radius: 12px; padding: 1.2rem 1.4rem; position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--card-accent, var(--accent-blue)); border-radius: 12px 12px 0 0;
  }
  .card-label { font-size: 11px; color: var(--text3); letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
  .card-value { font-family: 'DM Mono', monospace; font-size: 1.4rem; font-weight: 500; color: var(--text); }
  .card-sub { font-size: 11px; color: var(--text2); margin-top: 4px; }
  .card-delta { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 4px; margin-top: 6px; font-family: 'DM Mono', monospace; }
  .up { background: rgba(61,214,140,0.12); color: var(--accent-green); }
  .down { background: rgba(248,113,113,0.12); color: var(--accent-red); }
  .flat { background: rgba(136,136,168,0.1); color: var(--text2); }

  .section { margin-bottom: 1.8rem; }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; flex-wrap: wrap; gap: 8px; }
  .section-title { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: 0.8px; text-transform: uppercase; }

  .tab-group { display: flex; gap: 4px; }
  .tab {
    background: none; border: 0.5px solid var(--border); border-radius: 6px;
    padding: 4px 12px; cursor: pointer; font-size: 12px; color: var(--text2);
    font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s;
  }
  .tab.active, .tab:hover { background: var(--surface2); color: var(--text); border-color: var(--border2); }

  .chart-box { background: var(--surface); border: 0.5px solid var(--border2); border-radius: 12px; padding: 1.4rem; }
  .chart-container { position: relative; width: 100%; height: 280px; }

  .legend { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

  /* 구글시트 안내 */
  .guide-box {
    background: var(--surface); border: 0.5px solid rgba(79,143,255,0.3);
    border-radius: 12px; padding: 1.4rem 1.6rem; margin-bottom: 1.8rem;
  }
  .guide-box h3 { font-size: 14px; font-weight: 500; color: var(--accent-blue); margin-bottom: 1rem; }
  .guide-steps { display: flex; flex-direction: column; gap: 10px; }
  .step { display: flex; gap: 12px; align-items: flex-start; }
  .step-num {
    width: 22px; height: 22px; border-radius: 50%; background: rgba(79,143,255,0.15);
    color: var(--accent-blue); font-size: 11px; font-weight: 500;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
  }
  .step p { font-size: 13px; color: var(--text2); line-height: 1.5; }
  .step p strong { color: var(--text); font-weight: 500; }
  .step code {
    display: inline-block; background: var(--surface2); border: 0.5px solid var(--border2);
    border-radius: 4px; padding: 1px 7px; font-family: 'DM Mono', monospace;
    font-size: 12px; color: var(--accent-amber);
  }
  .sheet-link {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--accent-blue); color: #fff; text-decoration: none;
    border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 500;
    margin-top: 12px; transition: opacity 0.15s;
  }
  .sheet-link:hover { opacity: 0.85; }

  /* 테이블 */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { color: var(--text3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 400; padding: 8px 12px; text-align: right; border-bottom: 0.5px solid var(--border); }
  th:first-child, th:nth-child(2) { text-align: left; }
  td { padding: 10px 12px; border-bottom: 0.5px solid var(--border); text-align: right; font-family: 'DM Mono', monospace; color: var(--text2); }
  td:first-child, td:nth-child(2) { font-family: 'Noto Sans KR', sans-serif; text-align: left; color: var(--text); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--surface2); }
  .badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 4px; font-family: 'Noto Sans KR', sans-serif; }
  .b1 { background: rgba(167,139,250,0.15); color: var(--accent-purple); }
  .b15 { background: rgba(245,158,11,0.15); color: var(--accent-amber); }

  .refresh-btn {
    background: var(--surface2); border: 0.5px solid var(--border2); border-radius: 8px;
    padding: 6px 14px; color: var(--text2); cursor: pointer; font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif; transition: all 0.15s; display: flex; align-items: center; gap: 6px;
  }
  .refresh-btn:hover { color: var(--text); border-color: var(--accent-blue); }
  .spin { display: inline-block; }
  .spin.spinning { animation: spin 0.8s linear infinite; }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  .error-msg { text-align: center; padding: 2rem; color: var(--text3); font-size: 13px; }
  .error-msg strong { display: block; color: var(--accent-red); font-size: 15px; margin-bottom: 8px; }

  .empty-state { text-align: center; padding: 3rem; color: var(--text3); }
  .empty-state strong { display: block; font-size: 15px; color: var(--text2); margin-bottom: 8px; }

  footer { margin-top: 2.5rem; padding-top: 1.2rem; border-top: 0.5px solid var(--border); color: var(--text3); font-size: 11px; text-align: center; }

  @media (max-width: 600px) {
    .wrapper { padding: 1.2rem 1rem; }
    .card-value { font-size: 1.1rem; }
    .chart-container { height: 220px; }
  }
  .unit-won {
  font-size: 0.6em;       /* 숫자보다 작게 */
  color: var(--text3);   /* 약간 흐리게 */
  margin-left: 2px;      /* 숫자와 약간 간격 */
  font-weight: 400;      /* 굵기 조절 */
}
</style>
</head>
<body>
<div class="wrapper">

  <header>
    <div>
      <h1>자산 <span>대시보드</span></h1>
      <p>구글 시트 연동 · 예금 + 주식 월별 추이</p>
    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
      <div class="status-badge">
        <div class="status-dot loading" id="statusDot"></div>
        <span id="statusText">불러오는 중...</span>
      </div>
      <button class="refresh-btn" onclick="loadData()">
        <span class="spin" id="spinIcon">↻</span> 새로고침
      </button>
    </div>
  </header>



  <!-- 요약 카드 -->
  <div class="cards">
    <div class="card" style="--card-accent:var(--accent-blue)">
      <div class="card-label">총 자산</div>
      <div class="card-value" id="cTotal">—</div>
      <div class="card-sub" id="cTotalDate">—</div>
      <div class="card-delta" id="cTotalDelta"></div>
    </div>
    <div class="card" style="--card-accent:var(--accent-green)">
      <div class="card-label">예금 합계</div>
      <div class="card-value" id="cDeposit">—</div>
      <div class="card-sub" id="cDepositDate">—</div>
      <div class="card-delta" id="cDepositDelta"></div>
    </div>
    <div class="card" style="--card-accent:var(--accent-purple)">
      <div class="card-label">주식 평가액</div>
      <div class="card-value" id="cStock">—</div>
      <div class="card-sub" id="cStockDate">—</div>
      <div class="card-delta" id="cStockDelta"></div>
    </div>
    <div class="card" style="--card-accent:var(--accent-amber)">
      <div class="card-label">주식 비중</div>
      <div class="card-value" id="cRatio">—</div>
      <div class="card-sub">총 자산 대비</div>
    </div>
  </div>

  <!-- 차트 -->
  <div class="section">
    <div class="section-header">
      <span class="section-title">추이 차트</span>
      <div class="tab-group">
        <button class="tab active" onclick="setMode('total',this)">총 자산</button>
        <button class="tab" onclick="setMode('both',this)">예금·주식</button>
        <button class="tab" onclick="setMode('deposit',this)">예금</button>
        <button class="tab" onclick="setMode('stock',this)">주식</button>
      </div>
    </div>
    <div class="chart-box">
      <div class="chart-container">
        <canvas id="mainChart" role="img" aria-label="월별 자산 추이 차트"></canvas>
      </div>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <!-- 테이블 -->
  <div class="section">
    <div class="section-header">
      <span class="section-title">전체 기록</span>
      <span style="font-size:11px;color:var(--text3)" id="rowCount"></span>
    </div>
    <div class="chart-box">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>날짜</th>
              
              <th>예금</th>
              <th>주식</th>
              <th>합계</th>
              <th>전회 대비</th>
              <th>메모</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <footer>장마감(오후 4시) 기준 · 구글 시트에서 데이터를 읽어옵니다</footer>
</div>

<script>
const SHEET_ID = '1sRe8DnQjOLV-2XxAMAbUH1u0OOQ3Hshg1DLLa4iGg5Y';
const SHEET_NAME = encodeURIComponent('시트1');
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${SHEET_NAME}`;

let allData = [];
let chart = null;
let mode = 'total';

function fmt(v) {
  if (v >= 1e8) {
    // 억 단위일 경우 숫자와 '억'을 분리하여 '억'에 클래스 부여
    return (v / 1e8).toFixed(2) + '<span class="unit-won">억</span>';
  }
  if (v >= 1e4) {
    return Math.round(v / 1e4).toLocaleString() + '<span class="unit-won">만</span>';
  }
  return Math.round(v).toLocaleString();
}

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + state;
  document.getElementById('statusText').textContent = text;
  const spin = document.getElementById('spinIcon');
  spin.className = 'spin' + (state === 'loading' ? ' spinning' : '');
}

async function loadData() {
  setStatus('loading', '불러오는 중...');
  try {
    const res = await fetch(URL + '&_=' + Date.now());
    const text = await res.text();
    const json = JSON.parse(text.replace(/^[^{]+/, '').replace(/[^}]+$/, ''));
    const rows = json.table.rows;

    allData = rows
      .map(r => {
        const cells = r.c;
        if (!cells || !cells[0] || !cells[0].v) return null;

        let date = '';
        const dv = cells[0].v;
        // 구글 시트 날짜는 "Date(yyyy,m,d)" 또는 문자열
        if (typeof dv === 'string' && dv.startsWith('Date(')) {
        // 기존 코드 부분:
// const parts = dv.replace('Date(','').replace(')','').split(',').map(Number);
// const d = new Date(parts[0], parts[1], parts[2]);
// date = d.toISOString().slice(0,10);

// 수정된 코드:
if (typeof dv === 'string' && dv.startsWith('Date(')) {
    const parts = dv.replace('Date(', '').replace(')', '').split(',').map(Number);
    // parts[0]=년, parts[1]=월, parts[2]=일
    // Month는 0부터 시작하므로 그대로 사용하되, 
    // 시간을 0시 0분 0초로 고정하여 생성합니다.
    const d = new Date(parts[0], parts[1], parts[2], 0, 0, 0);
    
    // ISOString을 쓰면 UTC 시차 때문에 하루가 뒤로 갈 수 있으므로 
    // 로컬 날짜를 직접 포맷팅합니다.
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    date = `${yyyy}-${mm}-${dd}`;
}
        } else if (typeof dv === 'string') {
          date = dv.trim();
        }
        if (!date) return null;

        const base = cells[1] ? (cells[1].v || '').toString().trim() : '';
        const deposit = cells[2] ? Number(cells[2].v) || 0 : 0;
        const stock = cells[3] ? Number(cells[3].v) || 0 : 0;
        const memo = cells[4] ? (cells[4].v || '').toString() : '';

        return { date, base, deposit, stock, memo };
      })
      .filter(Boolean)
      .sort((a, b) => a.date.localeCompare(b.date));

    if (allData.length === 0) {
      setStatus('err', '데이터 없음');
      showEmpty();
      return;
    }

    const now = new Date().toLocaleString('ko-KR', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    setStatus('ok', '업데이트 ' + now);
    render();
  } catch(e) {
    setStatus('err', '불러오기 실패');
    showError();
    console.error(e);
  }
}

function showEmpty() {
  document.getElementById('tableBody').innerHTML =
    '<tr><td colspan="7"><div class="empty-state"><strong>데이터가 없어요</strong>구글 시트에 데이터를 입력해주세요</div></td></tr>';
}

function showError() {
  document.getElementById('tableBody').innerHTML =
    '<tr><td colspan="7"><div class="error-msg"><strong>연결 실패</strong>구글 시트 공개 설정을 확인해주세요<br><br>공유 → 링크가 있는 모든 사용자 → 뷰어</div></td></tr>';
}

function delta(cur, prev, el) {
  if (!el || prev === undefined) return;
  const d = cur - prev;
  const pct = ((d / prev) * 100).toFixed(1);
  const sign = d >= 0 ? '+' : '';
  el.textContent = sign + fmt(d) + ' (' + sign + pct + '%)';
  el.className = 'card-delta ' + (d > 0 ? 'up' : d < 0 ? 'down' : 'flat');
}

function render() {
  const list = allData;
  const last = list[list.length - 1];
  const prev = list[list.length - 2];

  if (last) {
    const total = last.deposit + last.stock;
    const ptotal = prev ? prev.deposit + prev.stock : undefined;

    document.getElementById('cTotal').innerHTML = fmt(total);
    document.getElementById('cTotalDate').textContent = last.date + ' 기준';
    delta(total, ptotal, document.getElementById('cTotalDelta'));

    document.getElementById('cDeposit').innerHTML = fmt(last.deposit);
    document.getElementById('cDepositDate').textContent = last.date + ' 기준';
    delta(last.deposit, prev?.deposit, document.getElementById('cDepositDelta'));

    document.getElementById('cStock').innerHTML = fmt(last.stock);
    document.getElementById('cStockDate').textContent = last.date + ' 기준';
    delta(last.stock, prev?.stock, document.getElementById('cStockDelta'));

    document.getElementById('cRatio').innerHTML = ((last.stock / total) * 100).toFixed(1) + '%';
  }

  renderChart();
  renderTable();
  document.getElementById('rowCount').innerHTML = list.length + '건';
}

function renderChart() {
  const list = allData;
  const labels = list.map(s => s.date.slice(2).replace(/-/g, '.'));
  const deposit = list.map(s => s.deposit);
  const stock = list.map(s => s.stock);
  const total = list.map(s => s.deposit + s.stock);

  const base = { tension: 0.3, pointRadius: 3, fill: false };
  const sets = {
    total: [{ ...base, label:'총 자산', data:total, borderColor:'#4f8fff', backgroundColor:'rgba(79,143,255,0.08)', fill:true }],
    deposit: [{ ...base, label:'예금', data:deposit, borderColor:'#3dd68c', backgroundColor:'rgba(61,214,140,0.08)', fill:true }],
    stock: [{ ...base, label:'주식', data:stock, borderColor:'#a78bfa', backgroundColor:'rgba(167,139,250,0.08)', fill:true }],
    both: [
      { ...base, label:'예금', data:deposit, borderColor:'#3dd68c', pointBackgroundColor:'#3dd68c' },
      { ...base, label:'주식', data:stock, borderColor:'#a78bfa', pointBackgroundColor:'#a78bfa' },
    ]
  };
  const legs = {
    total: [{c:'#4f8fff',l:'총 자산'}],
    deposit: [{c:'#3dd68c',l:'예금'}],
    stock: [{c:'#a78bfa',l:'주식'}],
    both: [{c:'#3dd68c',l:'예금'},{c:'#a78bfa',l:'주식'}],
  };

  document.getElementById('legend').innerHTML = legs[mode].map(x =>
    `<div class="legend-item"><div class="legend-dot" style="background:${x.c}"></div>${x.l}</div>`
  ).join('');

  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('mainChart'), {
    type: 'line',
    data: { labels, datasets: sets[mode] },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1e1e28', borderColor: 'rgba(255,255,255,0.1)', borderWidth: 1,
          titleColor: '#8888a8', bodyColor: '#e8e8f0', padding: 12,
          callbacks: { label: ctx => ' ' + ctx.dataset.label + ': ' + fmt(ctx.parsed.y) }
        }
      },
      scales: {
        y: { ticks: { callback: v => fmt(v), color:'#555570', font:{size:11} }, grid:{color:'rgba(255,255,255,0.04)'}, border:{color:'transparent'} },
        x: { ticks: { color:'#555570', font:{size:10}, maxRotation:45, autoSkip:true, maxTicksLimit:14 }, grid:{display:false}, border:{color:'rgba(255,255,255,0.07)'} }
      }
    }
  });
}

function renderTable() {
  const list = [...allData].reverse();
  document.getElementById('tableBody').innerHTML = list.map((s, i, arr) => {
    const prev = arr[i + 1];
    const total = s.deposit + s.stock;
    const ptotal = prev ? prev.deposit + prev.stock : null;
    const d = ptotal !== null ? total - ptotal : null;
    const sign = d !== null && d >= 0 ? '+' : '';
    const cls = d > 0 ? 'up' : d < 0 ? 'down' : 'flat';
    const deltaHtml = d !== null
      ? `<span class="card-delta ${cls}">${sign}${fmt(d)}</span>`
      : '—';
    const badgeClass = s.base === '1일' ? 'b1' : 'b15';

    return `<tr>
      <td>${s.date}</td>
      <td>${fmt(s.deposit)}</td>
      <td>${fmt(s.stock)}</td>
      <td style="color:var(--text);font-weight:500">${fmt(total)}</td>
      <td>${deltaHtml}</td>
      <td style="font-family:'Noto Sans KR',sans-serif;font-size:12px;color:var(--text3)">${s.memo}</td>
    </tr>`;
  }).join('');
}

function setMode(m, el) {
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  if (allData.length) renderChart();
}

loadData();
</script>
</body>
</html>
